name: Hemster
description: >-
  Hemster is a fashion-technology company that modernizes tailoring and garment
  fit through a digital "Fit Profile" system. Customers create a personalized fit
  pattern once, then match any garment — new or from their existing closet — to
  that saved profile so it can be tailored to their perfect fit rather than to a
  standard size. The platform aims to reduce returns, extend the life of clothing
  people already own, and remove size-related hesitation at purchase, with a
  sustainability angle around keeping garments out of landfill. Hemster operates a
  consumer web app at my.hemster.co and a related returns/deadstock product
  ((re)vive / byrevive.com). It is backed by Bullpen Capital. As of this profile
  Hemster publishes no public developer, API, or integration surface; this record
  is maintained in the API Evangelist network as a company lead.
